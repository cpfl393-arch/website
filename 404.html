<style>
:root{
  --maroon:#500000; --maroon-lt:#7d2b2b; --clay:#B5714F; --gold:#C9A227;
  --ink:#1a1d21; --body:#43494f; --muted:#7b838c;
  --cream:#FBF8F5; --sand:#F3EDE7; --line:#E7DFD8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#fff;color:var(--body);font-family:Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:16.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--maroon-lt);text-decoration:none}
a:hover{color:var(--maroon)}
img{max-width:100%}

/* nav */
.nav{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1060px;margin:0 auto;padding:.9rem 1.6rem;display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.brand{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.16rem;color:var(--maroon);margin-right:auto;letter-spacing:-.01em}
.brand span{color:var(--clay)}
.nav a.pg{font-size:.93rem;color:#4d545b;padding:.35rem .8rem;border-radius:99px;transition:.18s}
.nav a.pg:hover{background:var(--sand);color:var(--maroon)}
.nav a.pg.active{background:var(--maroon);color:#fff}
.icons{margin-left:.6rem;display:flex;gap:.1rem}
.icons a{width:34px;height:34px;display:grid;place-items:center;border-radius:99px;color:#5b6169;transition:.18s}
.icons a:hover{background:var(--maroon);color:#fff}

main{max-width:1060px;margin:0 auto;padding:0 1.6rem 5rem}

/* type */
.serif{font-family:Fraunces,Georgia,serif}
.eyebrow{font-size:.73rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--clay);margin-bottom:.5rem}
h1.big{font-family:Fraunces,Georgia,serif;font-size:clamp(2.6rem,6vw,4rem);line-height:1.06;font-weight:600;color:var(--ink);letter-spacing:-.025em}
h1.pg-title{font-family:Fraunces,Georgia,serif;font-size:clamp(2rem,4vw,2.7rem);font-weight:600;color:var(--ink);letter-spacing:-.02em;margin-bottom:.4rem}
h2{font-family:Fraunces,Georgia,serif;font-size:1.42rem;font-weight:600;color:var(--maroon);margin:0 0 1rem;letter-spacing:-.01em}
h3{font-size:1.03rem;font-weight:600;color:var(--ink)}
.lede{font-size:1.14rem;color:var(--body);line-height:1.7}
p{margin-bottom:1.05rem}
.sec{margin-top:3.6rem}
.pg-head{padding-top:3rem}

/* hero */
.hero{position:relative;padding:4.2rem 0 3.4rem;display:grid;grid-template-columns:1fr 300px;gap:4rem;align-items:center}
.hero::before{content:"";position:absolute;inset:-40% -30% auto auto;width:620px;height:620px;background:radial-gradient(circle at 30% 30%,rgba(181,113,79,.13),transparent 62%);z-index:-1;pointer-events:none}
.hero::after{content:"";position:absolute;left:-16%;bottom:-24%;width:460px;height:460px;background:radial-gradient(circle,rgba(80,0,0,.07),transparent 64%);z-index:-1;pointer-events:none}
.tagline{font-family:Fraunces,Georgia,serif;font-size:1.28rem;font-style:italic;color:var(--clay);margin:.5rem 0 1.5rem;font-weight:400}
.photo-wrap{position:relative}
.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;display:block;box-shadow:0 18px 46px -18px rgba(80,0,0,.32)}
.photo-ring{position:absolute;inset:-13px;border:1px solid var(--line);border-radius:50%;pointer-events:none}
.photo-ring.two{inset:-26px;border-color:#f2ece7}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:1.1rem 0}
.chip{font-size:.83rem;padding:.32rem .8rem;border-radius:99px;background:var(--sand);color:#6c4a3c;border:1px solid #e8ded5}
.chip.dark{background:var(--maroon);color:#fff;border-color:var(--maroon)}

/* band */
.band{background:var(--cream);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:3.4rem calc(50% - 50vw);padding:3rem calc(50vw - 50% + 1.6rem)}
.quote{font-family:Fraunces,Georgia,serif;font-size:clamp(1.25rem,2.6vw,1.72rem);line-height:1.5;color:var(--ink);font-weight:400;max-width:44ch}
.quote em{color:var(--maroon);font-style:italic}

/* cards */
.grid{display:grid;gap:1.1rem}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{border:1px solid var(--line);border-radius:14px;padding:1.5rem 1.6rem;background:#fff;transition:.2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px -18px rgba(26,29,33,.28);border-color:#dcd0c6}
.card .num{font-family:Fraunces,Georgia,serif;font-size:2.4rem;color:var(--sand);position:absolute;top:.4rem;right:1rem;line-height:1;font-weight:600}
.card h3{margin-bottom:.4rem}
.card p{font-size:.95rem;color:var(--muted);margin:0}

.paper{border-left:3px solid var(--maroon);padding:.2rem 0 .2rem 1.3rem;margin-bottom:2rem}
.paper .status{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);font-weight:600}
.paper h3{font-family:Fraunces,Georgia,serif;font-size:1.2rem;font-weight:600;color:var(--ink);margin:.3rem 0 .5rem;line-height:1.4}
.paper p{font-size:.96rem;color:var(--muted);margin:0}

/* timeline */
.tl{position:relative;padding-left:1.9rem}
.tl::before{content:"";position:absolute;left:5px;top:.6rem;bottom:.6rem;width:1px;background:var(--line)}
.tl-item{position:relative;margin-bottom:2rem}
.tl-item::before{content:"";position:absolute;left:-1.9rem;top:.55rem;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--clay)}
.tl-item.now::before{background:var(--maroon);border-color:var(--maroon);box-shadow:0 0 0 4px rgba(80,0,0,.1)}
.tl-when{font-size:.82rem;letter-spacing:.05em;color:var(--clay);font-weight:600;text-transform:uppercase}
.tl-item h3{margin:.15rem 0 .1rem;font-size:1.05rem}
.tl-where{font-size:.93rem;color:var(--muted);margin-bottom:.5rem}
.tl-item ul{margin:.4rem 0 0 1.1rem;font-size:.95rem;color:var(--body)}
.tl-item li{margin-bottom:.25rem}

/* misc */
.btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--maroon);color:#fff;border-radius:99px;padding:.6rem 1.3rem;font-size:.93rem;font-weight:500;transition:.2s}
.btn:hover{background:#3d0000;color:#fff;transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--maroon);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.dl{display:grid;grid-template-columns:190px 1fr;gap:.5rem 1.4rem;font-size:.97rem}
.dl dt{font-weight:600;color:var(--ink)}
.dl dd{color:var(--muted)}
.note{background:var(--cream);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:.9rem 1.2rem;font-size:.94rem;color:#5c5348}
.contact-row{display:flex;align-items:center;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--line);font-size:.98rem}
.contact-row i{color:var(--clay);width:20px;text-align:center}
footer{border-top:1px solid var(--line);margin-top:4rem;padding:1.8rem 0;display:flex;justify-content:space-between;color:var(--muted);font-size:.87rem;flex-wrap:wrap;gap:.5rem}

@media(max-width:880px){
  .hero{grid-template-columns:1fr;gap:2.4rem;padding-top:2.6rem}
  .photo-wrap{max-width:230px;order:-1}
  .g3,.g2{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:.1rem 0}
  .dl dd{margin-bottom:.8rem}
}
</style>
